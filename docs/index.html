<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Loxi - Lox interpreter playground</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Loxi - An online Lox bytecode interpreter playground with a mark and sweep garbage collector, written in Odin and compiled to WebAssembly." />
    <meta name="keywords" content="lox, interpreter, playground, odin, wasm, webassembly, crafting interpreters, bytecode, programming language" />
    <meta property="og:title" content="Loxi - Lox interpreter playground" />
    <meta property="og:description" content="An online Lox bytecode interpreter playground with a mark and sweep garbage collector, written in Odin and compiled to WebAssembly." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://shettysach.github.io/Loxi" />
    <link rel="canonical" href="https://shettysach.github.io/Loxi" />
    <link rel="stylesheet" type="text/css" href="./styles.css" />
    <link rel="icon" type="image/x-icon" href="./loki.ico" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Libertinus+Mono:wght@400&display=swap"
      rel="stylesheet"
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Libertinus+Serif:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&display=swap"
      rel="stylesheet"
    />

    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
  </head>
  <body>
    <div id="top-bar">
      <h1><a href="https://shettysach.github.io/Loxi">LOXI</a></h1>
      <span>
        Bytecode interpreter for
        <a href="https://craftinginterpreters.com/the-lox-language.html">Lox</a
        >,<wbr /> written&nbspin&nbsp<a href="https://odin-lang.org/">Odin</a>
      </span>
      <a href="https://github.com/shettysach/Loxi">[source code]</a>
    </div>

    <div id="tab-bar">
      <button class="tab active" data-tab="file">File</button>
      <button class="tab" data-tab="repl">REPL</button>
      <span id="file-controls">
        <select id="example-dropdown" title="Example">
          <option value="" disabled selected>Example</option>
        </select>
        <button onclick="submitCode()" title="Ctrl+Enter">▶ Run</button>
      </span>
    </div>

    <div id="main">
      <div id="left-panel">
        <div id="file-mode">
          <div class="editor-container">
            <div id="line-numbers"></div>
            <div id="code-editor">
              <pre><code id="highlighted-code" class="language-lox"></code></pre>
              <textarea
                id="code-input"
                placeholder="Type your Lox code here."
              ></textarea>
            </div>
          </div>
        </div>
        <div id="repl-mode" style="display: none">
          <div id="repl-scroll">
            <div id="repl-history"></div>
            <div id="repl-input-line">
              <span id="repl-prompt">&gt; </span>
              <div id="repl-editor">
                <pre><code id="repl-highlighted" class="language-lox"></code></pre>
                <textarea id="repl-input" rows="1"></textarea>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div id="right-panel">
        <div id="output" placeholder="Output appears here."></div>
      </div>
    </div>

    <script src="lox.js"></script>
    <script src="script.js" defer></script>
  </body>
</html>
